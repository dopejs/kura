name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: Daemon (Rust, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      # Same isolated wrapper as `make daemon-test`, so CI and local runs see
      # the same TMPDIR handling.
      - name: Test workspace
        run: ../scripts/cargo-test-isolated.sh --workspace
      - name: Contract tests
        run: ../scripts/cargo-test-isolated.sh -p kura-contracts
      - name: Route parity gate
        run: ../scripts/cargo-test-isolated.sh -p kura-api --test route_parity
      # Stage 3.1-3.5: tenant isolation proven against real containers (cross-
      # tenant reads, the daemon's data dir, root, network, cgroup limits,
      # container cleanup, live stdio, egress only via the proxy). Linux
      # runners have docker; the sandbox only selects the backend when its
      # image is already present.
      - name: Isolated execution (real containers)
        if: runner.os == 'Linux'
        env:
          KURA_DOCKER_TESTS: "1"
        # The egress test runs the real `kura egress-proxy` as the sidecar of
        # an --internal tenant network (Stage 3.5), from ubuntu:24.04 to
        # match the runner's glibc.
        run: |
          docker pull alpine:3.20
          docker pull ubuntu:24.04
          cargo build -p kura-cli
          KURA_EGRESS_PROXY_BIN="$PWD/target/debug/kura" \
            ../scripts/cargo-test-isolated.sh -p kura-sandbox --test isolation
      # The pipe used here previously took its exit code from `tail`, so a
      # clippy failure could never fail the job. Errors are now fatal; the
      # existing warning backlog is still tolerated.
      - name: Clippy (errors are fatal)
        run: cargo clippy --workspace --all-targets

  clients:
    name: Clients (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build + test SDK and web
        run: pnpm test:clients
      - name: Typecheck web
        run: pnpm typecheck:web

  browser-worker-image:
    name: Browser worker image (build + protocol smoke)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: capabilities/browser/Dockerfile
          tags: kura-browser-worker:ci
          load: true
          cache-from: type=gha,scope=browser-worker
          cache-to: type=gha,mode=max,scope=browser-worker
      # The image as a tenant browser runs it (docs/harness/tenant-browser.md
      # §3): another uid, no capabilities, read-only root, no network. A
      # start, a click and a snapshot must answer over the worker protocol,
      # and a click that downloads must save the file to the download dir.
      - name: Protocol smoke under the tenant-isolated flags
        run: |
          session='{"computerUseSessionId":"cus_ci","runId":"run_ci","status":"starting","driverKind":"browser","startedAt":"2026-01-01T00:00:00Z","updatedAt":"2026-01-01T00:00:00Z"}'
          page='data:text/html,<title>ci</title><h1>hello from ci</h1><a id=go href=%23x>go</a><a id=dl download=hello.txt href=data:text/plain,hello>dl</a>'
          action='{"computerUseActionId":"cua_1","computerUseSessionId":"cus_ci","runId":"run_ci","actionKind":"click","status":"requested","input":{"selector":"#go"},"requestedAt":"2026-01-01T00:00:00Z","updatedAt":"2026-01-01T00:00:00Z"}'
          download=$(echo "$action" | sed 's/"cua_1"/"cua_2"/; s/"click"/"download"/; s/#go/#dl/')
          out=$( (printf '%s\n' \
              "{\"id\":1,\"op\":\"start_session\",\"session\":$session,\"input\":{\"initialUrl\":\"$page\"}}" \
              "{\"id\":2,\"op\":\"execute_action\",\"session\":$session,\"action\":$action}" \
              "{\"id\":3,\"op\":\"execute_action\",\"session\":$session,\"action\":$download}"; sleep 15) | \
            timeout 60 docker run --rm -i --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges \
              --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m --network none --ipc private --init \
              --memory 1024m --memory-swap 1024m --pids-limit 512 -e KURA_BROWSER_DOWNLOAD_DIR=/tmp/downloads \
              kura-browser-worker:ci node /opt/kura-browser/worker.mjs) || true
          echo "$out" | cut -c1-300
          echo "$out" | grep -q '"id":1,"ok":true' || { echo "start_session failed" >&2; exit 1; }
          echo "$out" | grep '"id":2,' | grep -q '"status":"completed"' || { echo "click failed" >&2; exit 1; }
          echo "$out" | grep '"id":2,' | grep -q 'page_snapshot' || { echo "no page snapshot" >&2; exit 1; }
          echo "$out" | grep '"id":3,' | grep -q '"fileName":"/tmp/downloads/hello.txt"' || { echo "download not saved" >&2; exit 1; }
          echo "$out" | grep '"id":3,' | grep -q '"byteSize":5' || { echo "download size wrong" >&2; exit 1; }
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: capabilities/browser/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kura-browser-worker:main
            ghcr.io/${{ github.repository_owner }}/kura-browser-worker:sha-${{ github.sha }}
          cache-from: type=gha,scope=browser-worker

  docker-image:
    name: Docker image (build + healthz smoke)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The cargo release build dominates this job; the GHA layer cache keeps
      # it off the critical path for runs that do not touch crates/.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          tags: kura-agent:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Regression guard for the build/runtime libc mismatch that made the
      # published image exit on start: a glibc binary in a musl base.
      - name: Start container
        run: |
          docker run -d --name kura-ci -p 127.0.0.1:19191:19191 kura-agent:ci
      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19191/healthz; then
              echo && echo "healthz ok after ${i}s" && exit 0
            fi
            sleep 1
          done
          echo "healthz did not come up within 30s" >&2
          docker logs kura-ci >&2 || true
          exit 1
      - name: Container logs
        if: always()
        run: docker logs kura-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f kura-ci || true
      # Publish only from main, and only after the smoke test passed (the
      # implicit success() guard). Deployments pin the sha-<commit> tag;
      # :main is a moving convenience tag. No build-args here: changing
      # KURA_VERSION would invalidate the cached cargo layer.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kura-agent:main
            ghcr.io/${{ github.repository_owner }}/kura-agent:sha-${{ github.sha }}
          cache-from: type=gha
