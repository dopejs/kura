name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and publish
        required: true
        default: v0.3.0

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          key: release-${{ matrix.target }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build web shell
        run: |
          pnpm install --frozen-lockfile
          pnpm build:clients
      - name: Build release binaries
        run: cargo build --release -p kura-cli -p kura-tui --target ${{ matrix.target }}
      - name: Package
        run: |
          VERSION="${RELEASE_TAG#v}"
          PKG="kura-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${PKG}"
          cp "target/${{ matrix.target }}/release/kura" "dist/${PKG}/kura"
          cp "target/${{ matrix.target }}/release/kura-tui" "dist/${PKG}/kura-tui"
          cp -r ../web/dist "dist/${PKG}/web"
          cp ../README.md "dist/${PKG}/" 2>/dev/null || true
          tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"
          (cd dist && shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: kura-${{ matrix.target }}
          path: |
            crates/dist/*.tar.gz
            crates/dist/*.sha256

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
