[workspace]
resolver = "2"
members = ["foundation/protocol", "engine/model-provider", "engine/core", "surface/cli", "surface/tui", "foundation/config", "iam/identity", "channels/im", "foundation/telemetry", "domains/billing", "foundation/bindings", "engine/llm", "engine/profiles", "engine/threads", "engine/router", "iam/secrets", "foundation/contracts", "domains/activation", "surface/api", "domains/capabilities", "domains/inventory", "domains/setupwizard", "channels/imtypes", "domains/livevalidation", "modeling/providers", "modeling/adapterrpc", "modeling/adapterprovider", "modeling/adapterref", "domains/integrations", "domains/policy", "domains/calendar", "domains/mail", "engine/runtime", "channels/feishulark", "modeling/opsreadiness", "domains/computeruse", "domains/artifacts", "domains/sandbox", "domains/delivery", "persistence/store", "engine/checkpoints", "engine/events", "channels/connectors", "channels/discord", "channels/matrix", "channels/slack", "channels/telegram", "domains/evaluation", "domains/audit", "domains/orchestration", "domains/skills", "domains/catalog", "domains/evidence", "domains/execprofile", "domains/triage", "domains/routine", "domains/reminders", "domains/webhook", "domains/memory", "domains/scheduler", "iam/tenancy", "persistence/migrationfixture", "domains/mcp", "domains/chat", "modeling/managedproviders", "surface/app", "foundation/plugin", "domains/session", "domains/context", "domains/improvement", "domains/tools", "foundation/egress", "domains/swarm", "modeling/openaiprovider"]

[workspace.package]
edition = "2024"
version = "0.2.4"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
kura-secrets = { path = "iam/secrets" }
kura-contracts = { path = "foundation/contracts" }
kura-activation = { path = "domains/activation" }
kura-capabilities = { path = "domains/capabilities" }
kura-inventory = { path = "domains/inventory" }
kura-integrations = { path = "domains/integrations" }
kura-policy = { path = "domains/policy" }
kura-setupwizard = { path = "domains/setupwizard" }
kura-im = { path = "channels/im" }
kura-imtypes = { path = "channels/imtypes" }
kura-livevalidation = { path = "domains/livevalidation" }
kura-providers = { path = "modeling/providers" }
kura-adapterrpc = { path = "modeling/adapterrpc" }
kura-adapterprovider = { path = "modeling/adapterprovider" }
kura-adapterref = { path = "modeling/adapterref" }
kura-api = { path = "surface/api" }
kura-config = { path = "foundation/config" }
kura-identity = { path = "iam/identity" }
kura-telemetry = { path = "foundation/telemetry" }
kura-billing = { path = "domains/billing" }
kura-bindings = { path = "foundation/bindings" }
kura-calendar = { path = "domains/calendar" }
kura-mail = { path = "domains/mail" }
kura-runtime = { path = "engine/runtime" }
kura-feishulark = { path = "channels/feishulark" }
kura-opsreadiness = { path = "modeling/opsreadiness" }
kura-computeruse = { path = "domains/computeruse" }
kura-artifacts = { path = "domains/artifacts" }
kura-sandbox = { path = "domains/sandbox" }
kura-delivery = { path = "domains/delivery" }
kura-store = { path = "persistence/store" }
kura-checkpoints = { path = "engine/checkpoints" }
kura-events = { path = "engine/events" }
kura-connectors = { path = "channels/connectors" }
kura-discord = { path = "channels/discord" }
kura-matrix = { path = "channels/matrix" }
kura-slack = { path = "channels/slack" }
kura-telegram = { path = "channels/telegram" }
kura-evaluation = { path = "domains/evaluation" }
kura-audit = { path = "domains/audit" }
kura-orchestration = { path = "domains/orchestration" }
kura-skills = { path = "domains/skills" }
kura-catalog = { path = "domains/catalog" }
kura-tools = { path = "domains/tools" }
kura-egress = { path = "foundation/egress" }
kura-swarm = { path = "domains/swarm" }
kura-openai-provider = { path = "modeling/openaiprovider" }
kura-evidence = { path = "domains/evidence" }
kura-execprofile = { path = "domains/execprofile" }
kura-triage = { path = "domains/triage" }
kura-routine = { path = "domains/routine" }
kura-webhook = { path = "domains/webhook" }
kura-memory = { path = "domains/memory" }
kura-scheduler = { path = "domains/scheduler" }
kura-plugin = { path = "foundation/plugin" }
kura-session = { path = "domains/session" }
kura-context = { path = "domains/context" }
kura-improvement = { path = "domains/improvement" }
kura-tenancy = { path = "iam/tenancy" }
kura-migrationfixture = { path = "persistence/migrationfixture" }
kura-mcp = { path = "domains/mcp" }
kura-chat = { path = "domains/chat" }
kura-managedproviders = { path = "modeling/managedproviders" }
kura-llm = { path = "engine/llm" }
kura-profiles = { path = "engine/profiles" }
kura-reminders = { path = "domains/reminders" }
kura-threads = { path = "engine/threads" }
kura-router = { path = "engine/router" }
kura-protocol = { path = "foundation/protocol" }
kura-model-provider = { path = "engine/model-provider" }
kura-core = { path = "engine/core" }
kura-app = { path = "surface/app" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
futures = "0.3"
parking_lot = "0.12"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
regex = "1"
ureq = "2"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "rt", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = { version = "1", features = ["server", "http1"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-stream = "0.3"
clap = { version = "4", features = ["derive", "env"] }

# Disk-hygiene: debug symbols + incremental compilation are the dominant
# source of `target/` bloat (a full dev/test build can reach ~76 GB).
# Disable both for dev/test profiles so `target/` stays bounded. Release
# already omits debug info by default.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
