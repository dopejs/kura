[package]
license.workspace = true
name = "kura-chat"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
kura-core.workspace = true
kura-llm.workspace = true
kura-plugin.workspace = true
kura-store.workspace = true
kura-events.workspace = true
kura-threads.workspace = true
kura-profiles.workspace = true
kura-bindings.workspace = true
kura-skills.workspace = true
kura-providers.workspace = true
kura-setupwizard.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
uuid = { workspace = true, features = ["v4"] }
# `net` is what supplies the IO driver the bridge runtime enables. It
# currently arrives anyway through feature unification, but relying on
# another crate to enable it is how the runtime ended up without IO in the
# first place.
tokio = { workspace = true, features = ["rt", "time", "net"] }

[dev-dependencies]
kura-config.workspace = true
futures.workspace = true
tempfile = "3"
serde_json.workspace = true
