[package]
license.workspace = true
name = "kura-workitems"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
kura-store.workspace = true
kura-events.workspace = true
kura-threads.workspace = true
kura-telemetry.workspace = true
# Rounds are chat turns (slice 2 runs them here: the API, the work_item.open
# tool and the IM hook all start rounds), and the tool is a kura-core Tool.
kura-chat.workspace = true
kura-core.workspace = true
kura-llm.workspace = true
# The IM hook implements kura-im's WorkItemHook seam.
kura-im.workspace = true
kura-imtypes.workspace = true
kura-connectors.workspace = true
kura-identity.workspace = true
# Slice 5: a round waits on, and runs under, the policy engine's approvals.
kura-policy.workspace = true
sha2.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
kura-router.workspace = true
kura-runtime.workspace = true
futures.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["time"] }
# The approval e2e drives a real MCP tool against a fake server session.
kura-mcp.workspace = true
kura-config.workspace = true
kura-sandbox.workspace = true
